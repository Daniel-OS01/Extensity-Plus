name: Release to Chrome Web Store

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build, Package, and Upload to Chrome Web Store
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Version Tag Match
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Manifest version ($MANIFEST_VERSION) does not match tag version ($TAG_VERSION)."
            /bin/false
          fi
          echo "Manifest version ($MANIFEST_VERSION) matches tag."

      - name: Run test suite
        run: npm test

      - name: Validate manifest
        run: npm run check:manifest

      - name: Build distributable extension
        run: EXTENSITY_DRIVE_CLIENT_ID='123-abc.apps.googleusercontent.com' EXTENSITY_DRIVE_WEB_CLIENT_ID='123-abc.apps.googleusercontent.com' make dist

      - name: Build Chrome Web Store submission bundle
        run: EXTENSITY_DRIVE_CLIENT_ID='123-abc.apps.googleusercontent.com' EXTENSITY_DRIVE_WEB_CLIENT_ID='123-abc.apps.googleusercontent.com' npm run bundle:chrome-store

      - name: Get Package Output Information
        id: bundle-info
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./manifest.json').version")"
          ZIP_NAME="${PACKAGE_NAME}-v${VERSION}.zip"
          ZIP_PATH="artifacts/chrome-web-store/${ZIP_NAME}"
          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify Chrome Web Store bundle exists
        run: |
          if [ ! -f "${{ steps.bundle-info.outputs.zip_path }}" ]; then
            echo "Error: Expected bundle zip at ${{ steps.bundle-info.outputs.zip_path }} not found."
            /bin/false
          fi

      - name: Upload Store Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chrome-store-submission-bundle-${{ github.ref_name }}
          path: artifacts/chrome-web-store/
          if-no-files-found: error

      - name: Upload to Chrome Web Store
        # Uses the unofficial chrome-web-store action. Ensure secrets are configured in the repo.
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          # Required inputs for upload
          file-path: ${{ steps.bundle-info.outputs.zip_path }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

          # Publish settings:
          # false: Upload as draft only. Review manually in developer dashboard before submitting for review.
          # true: Upload and immediately submit for review to publish to the store.
          publish: false

      - name: Publish Success Summary
        if: success()
        run: |
          {
            echo "## Chrome Web Store Upload Successful"
            echo "Successfully uploaded \`${{ steps.bundle-info.outputs.zip_name }}\` to the Chrome Web Store dashboard."
            echo ""
            echo "⚠️ **Next Steps:**"
            echo "1. Go to the [Chrome Developer Dashboard](https://chrome.google.com/webstore/devconsole/)"
            echo "2. Verify the draft package looks correct."
            echo "3. Submit for review manually when ready."
          } >> "$GITHUB_STEP_SUMMARY"
