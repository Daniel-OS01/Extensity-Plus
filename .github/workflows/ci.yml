name: Extensity CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Manifest Validation
      run: pnpm run check:manifest

    - name: Run Core Logic Tests
      run: pnpm test

    - name: Build Minified Distributable
      run: EXTENSITY_DRIVE_CLIENT_ID='123-abc.apps.googleusercontent.com' EXTENSITY_DRIVE_WEB_CLIENT_ID='123-abc.apps.googleusercontent.com' make dist

    - name: Create Production Bundle (Smoke Test)
      if: matrix.node-version == '22.x'
      run: EXTENSITY_DRIVE_CLIENT_ID='123-abc.apps.googleusercontent.com' EXTENSITY_DRIVE_WEB_CLIENT_ID='123-abc.apps.googleusercontent.com' pnpm run bundle:chrome-store

    - name: Verify Dist Artifact
      if: matrix.node-version == '22.x'
      run: |
        test -f dist/dist.zip
        test -f dist/manifest.json

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Integration Test - Background Script
      run: node tests/background-sync.test.js

    - name: Integration Test - UI Engines
      run: |
        node tests/engine-lifecycle.test.js
        node tests/options-view.test.js

  lint:
    name: Lint & Structure Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install Pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check HTML File Structure
      run: |
        # Ensure all required HTML views exist
        test -f index.html
        test -f options.html
        test -f dashboard.html
        test -f profiles.html

    - name: Check API usage
      run: |
        # Quick grep to ensure we aren't using forbidden APIs (e.g., eval in background)
        if grep -rnw 'js/' -e 'eval('; then
          echo "Error: Forbidden 'eval' usage found."
          /bin/false
        fi

    - name: Verify Bundle Script Syntax
      run: node --check scripts/create-chrome-store-bundle.js

  bundle-verification:
    name: Store Bundle Artifact Generation
    runs-on: ubuntu-latest
    needs: [build, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install Pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Create Production Build
      run: EXTENSITY_DRIVE_CLIENT_ID='123-abc.apps.googleusercontent.com' EXTENSITY_DRIVE_WEB_CLIENT_ID='123-abc.apps.googleusercontent.com' make dist

    - name: Generate Chrome Web Store Artifacts
      run: EXTENSITY_DRIVE_CLIENT_ID='123-abc.apps.googleusercontent.com' EXTENSITY_DRIVE_WEB_CLIENT_ID='123-abc.apps.googleusercontent.com' pnpm run bundle:chrome-store

    - name: Verify Store Artifact Integrity
      run: |
        PACKAGE_NAME="$(node -p "require('./package.json').name")"
        VERSION="$(node -p "require('./manifest.json').version")"

        test -f "artifacts/chrome-web-store/${PACKAGE_NAME}-v${VERSION}.zip"
        test -f artifacts/chrome-web-store/manifest.json
        test -f artifacts/chrome-web-store/submission-metadata.json

        # Verify JSON metadata is parsable
        jq . artifacts/chrome-web-store/submission-metadata.json > /dev/null

    - name: Upload Store Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chrome-store-bundle
        path: artifacts/chrome-web-store/
        retention-days: 7

  e2e-dummy:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E Test Suite
        run: |
          echo "Running Mock E2E tests for the extension UI..."
          # Mock test sequence
          node -e "assert=require('assert'); assert.ok(true, 'Extension boots up');"
          node -e "assert=require('assert'); assert.ok(true, 'Profiles view renders');"

  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Run Audit
        run: pnpm audit --prod --audit-level=high

  release-dry-run:
    name: Release Preparation (Dry Run)
    runs-on: ubuntu-latest
    needs: [integration-tests, bundle-verification, e2e-dummy, security-scan]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Build Dist
        run: EXTENSITY_DRIVE_CLIENT_ID='123-abc.apps.googleusercontent.com' EXTENSITY_DRIVE_WEB_CLIENT_ID='123-abc.apps.googleusercontent.com' make dist

      - name: Generate Final Artifacts
        run: |
          echo "Simulating release package assembly"
          if EXTENSITY_DRIVE_CLIENT_ID='123-abc.apps.googleusercontent.com' EXTENSITY_DRIVE_WEB_CLIENT_ID='123-abc.apps.googleusercontent.com' pnpm run bundle:chrome-store; then
             echo "Release package created successfully"
          else
             echo "Failed to create release package"
             /bin/false
          fi
