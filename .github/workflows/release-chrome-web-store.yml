name: Release to Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target (default or trustedTesters)'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - trustedTesters
      publish:
        description: 'Publish immediately (or just draft)?'
        required: true
        default: true
        type: boolean

jobs:
  release:
    name: Build, bundle, and submit to Chrome Web Store
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject Chrome extension OAuth client ID
        run: |
          # Read existing manifest, inject the real client ID from secrets, write back
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (!manifest.oauth2) manifest.oauth2 = {};
            manifest.oauth2.client_id = process.env.EXTENSITY_DRIVE_CLIENT_ID;
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "
        env:
          EXTENSITY_DRIVE_CLIENT_ID: ${{ secrets.EXTENSITY_DRIVE_CLIENT_ID }}

      - name: Build distributable extension
        env:
          EXTENSITY_DRIVE_WEB_CLIENT_ID: ${{ secrets.EXTENSITY_DRIVE_WEB_CLIENT_ID }}
        run: make dist

      - name: Build Chrome Web Store submission bundle
        run: npm run bundle:chrome-store

      - name: Resolve submission zip path
        id: resolve_zip
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./manifest.json').version")"
          ZIP_PATH="artifacts/chrome-web-store/${PACKAGE_NAME}-v${VERSION}.zip"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ${{ steps.resolve_zip.outputs.ZIP_PATH }}
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: ${{ github.event.inputs.publish || true }}
          publish-target: ${{ github.event.inputs.target || 'default' }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ${{ steps.resolve_zip.outputs.ZIP_PATH }}
            artifacts/chrome-web-store/manifest.json
            artifacts/chrome-web-store/submission-metadata.json
            artifacts/chrome-web-store/checksums.txt
          generate_release_notes: true
          draft: true
          prerelease: false
